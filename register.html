<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Sparkle</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/auth.js"></script>
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), url('images/background.png');
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">Sparkle</a>
        <div class="nav-links">
            <a href="cart.html" class="cart-icon" style="text-decoration: none;">
                <span style="color: white; font-size: 1.2rem;">🛒</span>
                <span class="cart-count">0</span>
            </a>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <div class="register-container glass-card" style="margin-top: 5rem;">
        <h1 class="form-title">Registration</h1>
        <form onsubmit="registerUser(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" class="form-input" placeholder="Enter name" required minlength="3">
            </div>

            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Password</label>
                    <input type="password" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Confirm Password</label>
                    <input type="password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Contact Number</label>
                    <input type="tel" class="form-input" placeholder="10 digit number">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Age</label>
                    <input type="number" class="form-input" placeholder="Enter age" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-input" placeholder="you@example.com" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Submit Registration</button>
        </form>
    </div>

</body>
</html>
